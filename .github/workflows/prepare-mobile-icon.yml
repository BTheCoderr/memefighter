name: Create original Meme Fighter iOS icon
on:
  push:
    branches:
      - feat/ios-landscape-release-prep
    paths:
      - mobile/scripts/make_icon.py
      - .github/workflows/prepare-mobile-icon.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow==11.3.0
      - run: python mobile/scripts/make_icon.py
      - name: Commit original iOS icon candidate
        run: |
          git add -f mobile/assets/icon.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets: generate original Meme Fighter iOS icon candidate"
            git push
          fi
